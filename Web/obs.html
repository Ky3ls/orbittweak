<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OrbitTweak Controller</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #pad { width: 100vw; height: 100vh; }
  #pad svg { display: block; }
</style>
</head>
<body>
<div id="pad"></div>
<script src="pad.js"></script>
<script>
(async () => {
  let cfg = { layout: 'auto', body: 'black', color: 'orig', accent: '#FF7A3D' }, geo = null, state = null;
  const r = new PadSVG(document.getElementById('pad'));
  async function loadCfg() {
    try {
      const c = await (await fetch('/cfg')).json();
      geo = c.geo; r.geo = geo; r.key = null;
      cfg = Object.assign(cfg, c.cfg);
      document.body.style.opacity = (c.cfg.opacity || 100) / 100;
      r.draw(state, cfg);
    } catch { }
  }
  await loadCfg();
  setInterval(loadCfg, 3000);
  const es = new EventSource('/state');
  es.onmessage = e => { state = JSON.parse(e.data); if (geo) r.draw(state, cfg); };
})();
</script>
</body>
</html>
